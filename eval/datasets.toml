# 평가에 쓰는 외부 데이터셋 목록: 출처·고정 커밋·받을 파일·라이선스·용도 (받은 파일은 eval/.cache/에 두고 재배포하지 않음, docs/research.md §9)
cache_dir = "eval/.cache"
lock_file = "eval/datasets.lock.json"
base_url = "https://huggingface.co/datasets/{id}/resolve/{revision}/{path}"

[[dataset]]
id = "NAMJOON/longmemeval-oracle-ko"
