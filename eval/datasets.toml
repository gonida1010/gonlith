files = ["data/korean_only.jsonl", "README.md"]
license = "MIT"
updated = "2026-09-27"
purpose = "Korean long-term conversational memory QA (oracle split, no distractor sessions)"
stage = "S7"

[[dataset]]
id = "nlpai-lab/miracl-multilingual-triplets"
